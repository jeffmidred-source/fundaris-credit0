<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | FUNDARIS CREDIT</title>
    <style>
      :root {
        --bg: #f4faf7;
        --panel: #ffffff;
        --line: #dfeae6;
        --text: #132b3c;
        --muted: #5c7385;
        --brand: #0d7c5f;
        --brand-dark: #0b5d4d;
        --danger: #b42318;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: linear-gradient(135deg, #ecf9f5, #edf5ff);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }
      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }
      .card {
        width: min(520px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 30px;
        box-shadow: 0 24px 60px rgba(18, 40, 58, 0.09);
      }
      h1 { margin: 0 0 10px; font-size: 2rem; }
      p { margin: 0 0 22px; color: var(--muted); }
      form { display: grid; gap: 14px; }
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        font: inherit;
      }
      button {
        border: none;
        background: linear-gradient(135deg, var(--brand), var(--brand-dark));
        color: #fff;
        font-weight: 700;
        border-radius: 12px;
        padding: 14px 18px;
        cursor: pointer;
      }
      .helper {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        font-size: 0.95rem;
        color: var(--muted);
      }
      .helper a {
        color: var(--brand);
        text-decoration: none;
        font-weight: 700;
      }
      .message {
        min-height: 22px;
        margin: 0;
        font-size: 0.95rem;
      }
      .message.error { color: var(--danger); }
      .message.success { color: var(--brand-dark); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Create your account</h1>
        <p>Open a customer account to track your loan status and upload verification documents.</p>

        <form id="register-form">
          <input type="text" name="fullName" placeholder="Full name" required />
          <input type="email" name="email" placeholder="Email address" required />
          <input type="tel" name="phone" placeholder="Phone number" required />
          <input type="password" name="password" placeholder="Create password" required />
          <button type="submit">Create account</button>
          <p id="message" class="message" aria-live="polite"></p>
        </form>

        <div class="helper">
          <span>Already have an account?</span>
          <a href="/account/login">Login</a>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById('register-form');
      const message = document.getElementById('message');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = Object.fromEntries(new FormData(form).entries());

        try {
          const response = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.message || 'Unable to create account');
          }

          message.textContent = 'Account created. Redirecting to dashboard...';
          message.className = 'message success';
          localStorage.setItem('kblcUser', JSON.stringify(result.user));
          setTimeout(() => {
            window.location.href = '/account/dashboard?userId=' + result.user.id;
          }, 600);
        } catch (error) {
          message.textContent = error.message;
          message.className = 'message error';
        }
      });
    </script>
  </body>
</html>
