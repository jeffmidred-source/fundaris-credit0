<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FUNDARIS CREDIT Admin Login</title>
    <style>
      :root {
        --bg: #f3faf7;
        --panel: #ffffff;
        --line: #dfeae5;
        --text: #12283a;
        --muted: #587083;
        --brand: #0d7c5f;
        --brand-dark: #0d1d2b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #ecf9f5, #eef7ff);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }
      .login-box {
        width: min(440px, calc(100% - 30px));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 30px;
        box-shadow: 0 25px 50px rgba(15, 34, 52, 0.08);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.8rem;
      }
      p { margin: 0 0 22px; color: var(--muted); }
      form { display: grid; gap: 14px; }
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        font: inherit;
      }
      button {
        border: none;
        border-radius: 12px;
        padding: 14px 18px;
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg, var(--brand), var(--brand-dark));
        cursor: pointer;
      }
      .status {
        min-height: 24px;
        margin: 0;
        color: var(--muted);
      }
      .status.error { color: #b42318; }
      .status.success { color: var(--brand); }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h1>FUNDARIS CREDIT</h1>
      <p>Admin login</p>

      <form id="admin-login-form">
        <input type="text" name="username" placeholder="Username" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Login</button>
        <p id="status" class="status" aria-live="polite"></p>
      </form>
    </div>

    <script>
      const form = document.getElementById('admin-login-form');
      const status = document.getElementById('status');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = Object.fromEntries(new FormData(form).entries());

        try {
          const response = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.message || 'Invalid admin credentials');
          }

          status.textContent = 'Login successful';
          status.className = 'status success';
          window.location.href = result.redirectTo;
        } catch (error) {
          status.textContent = error.message;
          status.className = 'status error';
        }
      });
    </script>
  </body>
</html>
